[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true

[program:laravel-scheduler]
command=/bin/bash -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:whatsapp-service]
command=/usr/bin/node /var/www/html/scripts/whatsapp-service.js
directory=/var/www/html
autostart=true
autorestart=true
startretries=999
startsecs=8
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=WHATSAPP_PORT="8051",GITHUB_BACKUP_TOKEN="%(ENV_GITHUB_BACKUP_TOKEN)s",GITHUB_BACKUP_OWNER="%(ENV_GITHUB_BACKUP_OWNER)s",GITHUB_BACKUP_REPO="%(ENV_GITHUB_BACKUP_REPO)s",GROQ_API_KEY="%(ENV_GROQ_API_KEY)s",GROQ_MODEL="%(ENV_GROQ_MODEL)s"
