pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

def capacitorRoot = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
if (!capacitorRoot.exists()) {
    throw new GradleException(
        'Capacitor no instalado. Ejecuta en CMD:\n' +
        '  cd ..\\mobile\n' +
        '  npm install --legacy-peer-deps\n' +
        '  npx cap sync android\n' +
        'Luego vuelve a abrir Android Studio en mobile\\android'
    )
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
