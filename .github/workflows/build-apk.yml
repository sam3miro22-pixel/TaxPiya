name: Build Taxpiya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Print APK SHA-1 for Firebase
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          echo "SHA-1 para Firebase (pegar en Console):"
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1:|SHA256:"

      - name: Copy APK to mobile root
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/Taxpiya-unified-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxpiya-unified-apk
          path: mobile/Taxpiya-unified-debug.apk
