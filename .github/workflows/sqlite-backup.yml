name: TaxPiya SQLite backup (gratis)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sqlite-backup.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Compute dump key
        id: keys
        env:
          TAXPIYA_APP_KEY: ${{ secrets.TAXPIYA_APP_KEY }}
        run: |
          if [ -z "$TAXPIYA_APP_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Falta secret TAXPIYA_APP_KEY"
            exit 0
          fi
          DUMP_KEY=$(php -r "echo substr(hash('sha256', getenv('TAXPIYA_APP_KEY').'taxpiya-dump'), 0, 40);")
          echo "dump_key=$DUMP_KEY" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download SQLite from Render
        if: steps.keys.outputs.skip == 'false'
        env:
          DUMP_KEY: ${{ steps.keys.outputs.dump_key }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --max-time 180 \
            "https://taxpiya.onrender.com/api/internal/sqlite-dump?key=${DUMP_KEY}" \
            -o taxpiya.sqlite
          test -s taxpiya.sqlite
          head -c 16 taxpiya.sqlite | grep -q 'SQLite format 3'

      - name: Upload to backup repo
        if: steps.keys.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.TAXPIYA_GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Falta secret TAXPIYA_GH_PAT"
            exit 1
          fi
          python3 <<'PY'
          import base64, json, os, urllib.error, urllib.request

          owner = "sam3miro22-pixel"
          repo = "taxpiya-db-backup"
          path = "taxpiya.sqlite"
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{owner}/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "TaxPiya-Backup",
          }

          sha = ""
          req = urllib.request.Request(api, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read().decode())
                  sha = data.get("sha") or ""
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          with open("taxpiya.sqlite", "rb") as fh:
              content = base64.b64encode(fh.read()).decode("ascii")

          payload = {
              "message": "TaxPiya backup",
              "content": content,
          }
          if sha:
              payload["sha"] = sha

          body = json.dumps(payload).encode("utf-8")
          put = urllib.request.Request(api, data=body, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(put, timeout=120) as resp:
              print("Upload OK", resp.status)
          PY
          echo "Backup subido a sam3miro22-pixel/taxpiya-db-backup"
