name: TaxPiya keepalive (Render + WhatsApp)

on:
  schedule:
    # Cada 5 min — evita que Render free duerma y reconecta WhatsApp
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TaxPiya (despertar Render + WhatsApp)
        env:
          TAXPIYA_APP_KEY: ${{ secrets.TAXPIYA_APP_KEY }}
        run: |
          if [ -z "$TAXPIYA_APP_KEY" ]; then
            echo "Sin TAXPIYA_APP_KEY — ping público solo"
            curl -fsS --retry 5 --retry-delay 20 --max-time 120 \
              "https://taxpiya.onrender.com/pasajero/login" -o /dev/null
            curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
              "https://app.taxpiya.com/pasajero/login" -o /dev/null || true
            exit 0
          fi
          KEY=$(php -r "echo substr(hash('sha256', getenv('TAXPIYA_APP_KEY').'taxpiya-keepalive'), 0, 40);")
          echo "Keepalive key computed"
          for URL in \
            "https://taxpiya.onrender.com/taxpiya/keepalive?key=${KEY}" \
            "https://taxpiya.onrender.com/api/system/keepalive?key=${KEY}"; do
            echo "Ping $URL"
            if curl -fsS --retry 5 --retry-delay 25 --max-time 180 "$URL" | tee keepalive.json; then
              break
            fi
          done
          echo ""
          cat keepalive.json
          curl -fsS --retry 2 --max-time 90 \
            "https://app.taxpiya.com/taxpiya/keepalive?key=${KEY}" -o /dev/null || true
