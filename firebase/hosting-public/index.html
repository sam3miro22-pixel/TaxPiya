<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxPiya — Taxi a tu alcance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #3a506b 100%);
      color: #fff;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 { font-size: 1.75rem; margin-bottom: 8px; color: #ffd166; }
    p { opacity: 0.85; line-height: 1.5; margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 12px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ffd166, #fb8500);
      color: #1a1a1a;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .domains { margin-top: 24px; font-size: 0.8rem; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TaxPiya</h1>
    <p>Solicita tu taxi o conduce con nosotros. Plataforma en línea.</p>
    <a class="btn btn-primary" href="https://app.taxpiya.com/pasajero/login">Soy pasajero</a>
    <a class="btn btn-secondary" href="https://app.taxpiya.com/conductor/login">Soy conductor</a>
    <p class="domains">tax-piya.web.app · tax-piya.firebaseapp.com</p>
  </div>
</body>
</html>
